server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rai2.si;

    root /opt/rai2/current/saas/public;
    ssl_certificate /etc/letsencrypt/live/rai2.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rai2.si/privkey.pem;

    add_header X-Content-Type-Options nosniff always;

    location = / { add_header Cache-Control "no-cache"; try_files /landing.html =404; }
    location = /landing.html { return 404; }
    location = /app { return 302 https://app.rai2.si/; }
    location = /app/ { return 302 https://app.rai2.si/; }
    location ^~ /api/ { return 302 https://app.rai2.si$request_uri; }
    location ^~ /assets/ { try_files $uri =404; }
    location = /landing.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /landing.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location / { return 302 https://app.rai2.si$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name rai2.si;
    return 301 https://rai2.si$request_uri;
}
