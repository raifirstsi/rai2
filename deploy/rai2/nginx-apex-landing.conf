server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rai2.si;

    root /opt/rai2/current/saas/public;
    ssl_certificate /etc/letsencrypt/live/rai2.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rai2.si/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = / { add_header Cache-Control "no-cache"; try_files /landing.html =404; }
    location = /landing.html { return 404; }

    # SEO & Crawlers
    location = /sitemap.xml { try_files /sitemap.xml =404; }
    location = /robots.txt { try_files /robots.txt =404; }
    location = /assets/rai-backend-favicon.png {
        alias /opt/rai2/branding/rai-backend-favicon.png;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /assets/ { try_files $uri =404; }
    location = /landing.css { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /landing.js { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # SSG Knowledge & Solutions
    location ^~ /giai-phap/ { try_files $uri $uri/ =404; }
    location ^~ /phuong-phap-luan/ { try_files $uri $uri/ =404; }

    # SaaS Account Portal Handoff
    location = /app { return 302 https://app.rai2.si/; }
    location = /app/ { return 302 https://app.rai2.si/; }
    location ^~ /api/ { return 302 https://app.rai2.si$request_uri; }
    location / { return 302 https://app.rai2.si$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name rai2.si;
    return 301 https://rai2.si$request_uri;
}
