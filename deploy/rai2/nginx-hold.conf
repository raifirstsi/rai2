server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.rai2.si *.rai2.si;

    ssl_certificate /etc/letsencrypt/live/app.rai2.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.rai2.si/privkey.pem;

    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    default_type text/plain;
    return 503 "RAI2 is preparing this service. Please try again later.\n";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.rai2.si *.rai2.si;
    return 301 https://$host$request_uri;
}
