server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name webhook-test.rai2.si;

    ssl_certificate /etc/letsencrypt/live/app.rai2.si/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.rai2.si/privkey.pem;

    location /api/webhooks/sepay {
        proxy_pass http://127.0.0.1:18812;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /healthz {
        proxy_pass http://127.0.0.1:18812;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
