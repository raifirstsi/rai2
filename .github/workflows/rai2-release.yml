name: RAI2 Release

on:
  push:
    tags: ["v*-rai2.*"]

permissions:
  contents: write

jobs:
  publish:
    name: verify and publish auditable artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compliance:rai2
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm saas:test
      - run: pnpm package:rai2
      - run: node scripts/smoke-rai2-package.mjs "$(realpath release/rai2-runtime-*.tgz)"
      - run: pnpm saas:package
      - run: node scripts/smoke-rai2-saas-package.mjs "$(realpath release/rai2-saas-*.tgz)"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME already exists"
            exit 1
          fi
          printf '%s\n' \
            'Auditable OSS-only RAI² baseline.' \
            '' \
            '- No restricted enterprise source is included.' \
            '- Runtime and SaaS archives have SHA-256 checksums and artifact-specific CycloneDX 1.6 SBOMs.' \
            '- Compliance, lint, typecheck, package and isolated smoke gates passed in this workflow.' \
            '- This engineering release is not a legal sign-off.' > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/rai2-* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "RAI² baseline ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
