name: RAI2 SaaS OSS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm compliance:rai2
      - run: pnpm lint
      - run: pnpm i18n:check:rai2
      - run: pnpm saas:check
      - run: pnpm saas:test
      - run: pnpm exec vitest run server/account-signin.test.ts server/request-auth.test.ts server/request-auth.e2e.test.ts server/sessions.test.ts server/brand.test.ts server/fleet.test.ts server/fleet-cli.test.ts server/fleet-agent.test.ts server/routes/update-check.test.ts src/pair/PairPage.test.ts
      - run: pnpm saas:smoke
      - run: pnpm build:oss-server
      - run: node scripts/smoke-oss-server.mjs

  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:rai2
      - run: node scripts/smoke-rai2-package.mjs release/rai2-runtime-*.tgz
      - run: pnpm saas:package
      - run: node scripts/smoke-rai2-saas-package.mjs release/rai2-saas-*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rai2-auditable-baseline-${{ github.sha }}
          path: release/rai2-*
          if-no-files-found: error
          retention-days: 30
